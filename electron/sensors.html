<!doctype html>
<html><head><meta charset="utf-8"><title>sensors</title></head>
<body>
<video id="v" muted playsinline style="display:none"></video>
<script>
// Hidden worker window: analyses system audio loopback and screen colour, streams results to main.
const { ipcRenderer } = require('electron');
let stream = null, ctx = null, analyser = null, want = { audio: false, screen: false }, timer = null;
let peak = 0.05, bassAvg = 0, lastBeat = 0;
const canvas = document.createElement('canvas'); canvas.width = 32; canvas.height = 18;
const g = canvas.getContext('2d', { willReadFrequently: true });
const video = document.getElementById('v');

async function restart() {
  stop();
  if (!want.audio && !want.screen) return;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 8, width: 320, height: 180 }, audio: want.audio });
    if (want.audio && stream.getAudioTracks().length) {
      ctx = new AudioContext();
      const src = ctx.createMediaStreamSource(new MediaStream(stream.getAudioTracks()));
      analyser = ctx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.55;
      src.connect(analyser);
    }
    if (want.screen) { video.srcObject = new MediaStream(stream.getVideoTracks()); await video.play(); }
    else stream.getVideoTracks().forEach((t) => t.stop());
    timer = setInterval(tick, 33);
  } catch (e) { ipcRenderer.send('sensor:error', String(e)); }
}
function stop() {
  clearInterval(timer);
  if (stream) stream.getTracks().forEach((t) => t.stop());
  if (ctx) ctx.close();
  stream = ctx = analyser = null;
}
let frame = 0;
function tick() {
  frame++;
  if (analyser) {
    const n = analyser.frequencyBinCount, d = new Uint8Array(n);
    analyser.getByteFrequencyData(d);
    const hz = ctx.sampleRate / analyser.fftSize;
    const band = (lo, hi) => { let s = 0, c = 0; for (let i = Math.floor(lo / hz); i < Math.min(n, Math.ceil(hi / hz)); i++) { s += d[i]; c++; } return c ? s / c / 255 : 0; };
    let bass = band(20, 160), mid = band(160, 2000), high = band(2000, 9000);
    let num = 0, den = 0;
    for (let i = 1; i < n; i++) { num += i * d[i]; den += d[i]; }
    const centroid = den ? Math.min(1, (num / den) / (n * 0.18)) : 0;
    const raw = Math.max(bass, mid * 0.8, high * 0.6);
    peak = Math.max(raw, peak * 0.995, 0.05);
    const norm = (x) => Math.min(1, x / peak);
    bass = norm(bass); mid = norm(mid); high = norm(high);
    const now = performance.now();
    bassAvg = bassAvg * 0.94 + bass * 0.06;
    const beat = bass > bassAvg * 1.35 && bass > 0.5 && now - lastBeat > 180;
    if (beat) lastBeat = now;
    ipcRenderer.send('sensor:audio', { bass, mid, high, level: norm(raw), centroid, beat: beat ? 1 : 0 });
  }
  if (want.screen && video.readyState >= 2 && frame % 3 === 0) {
    g.drawImage(video, 0, 0, 32, 18);
    const px = g.getImageData(0, 0, 32, 18).data;
    let r = 0, gr = 0, b = 0, w = 0;
    for (let i = 0; i < px.length; i += 4) {
      const mx = Math.max(px[i], px[i + 1], px[i + 2]), mn = Math.min(px[i], px[i + 1], px[i + 2]);
      const wt = 0.15 + (mx - mn) / 255 * 2 + mx / 255 * 0.3; // favour vivid, bright pixels
      r += px[i] * wt; gr += px[i + 1] * wt; b += px[i + 2] * wt; w += wt;
    }
    ipcRenderer.send('sensor:screen', { r: r / w, g: gr / w, b: b / w });
  }
}
ipcRenderer.on('sensor:want', (_e, w) => { if (w.audio !== want.audio || w.screen !== want.screen) { want = w; restart(); } });
</script>
</body></html>
